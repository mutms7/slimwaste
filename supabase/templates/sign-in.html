<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px;
      background: #edf5e9;
      font-family: Arial, sans-serif;
      color: #102a24;
    "
  >
    <main
      style="
        max-width: 480px;
        margin: auto;
        padding: 32px;
        background: #fff;
        border-top: 8px solid #ffe326;
      "
    >
      <h1 style="font-size: 28px; letter-spacing: -1px">slimwaste.</h1>
      <p>Here's your sign-in code. Enter it in SlimWaste to continue.</p>
      <p style="font-size: 36px; font-weight: bold; letter-spacing: 8px">
        {{ .Token }}
      </p>
      <p>
        This code expires in 10 minutes. If you didn't request it, you can
        ignore this email.
      </p>
    </main>
  </body>
</html>
